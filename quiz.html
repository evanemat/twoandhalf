<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>poll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 30% 25%, #c4924e 0%, #2a1a0a 40%, #1a0814 65%, #2d1020 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', 'Arial Black', sans-serif;
      overflow: hidden;
    }

    /* ---- QUESTION CARD ---- */
    .card {
      background: #fff;
      border-radius: 28px;
      padding: 36px 28px 28px;
      width: 320px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
      border: 3px solid #111;
    }

    .star { font-size: 3rem; display: block; margin-bottom: 12px; }

    h1 {
      font-size: 2.8rem;
      font-weight: 900;
      color: #111;
      letter-spacing: -1px;
      margin-bottom: 26px;
    }

    .poll-row {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 18px 8px;
      border-radius: 14px;
      border: 3px solid #111;
      font-size: 1rem;
      font-weight: 900;
      font-family: 'Nunito', 'Arial Black', sans-serif;
      text-transform: lowercase;
      cursor: pointer;
      outline: none;
      box-shadow: 3px 3px 0 #111;
      transition: transform 0.1s, box-shadow 0.1s;
      /* IMPORTANT: position static, not fixed */
      position: static;
    }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #111; }

    .btn-yes { background: #7ee89a; color: #111; }
    .btn-no  { background: #f9a8bc; color: #111; }

    /* flying "ні" button — only this one is fixed */
    #btnNoFly {
      position: fixed;
      z-index: 999;
      padding: 16px 32px;
      border-radius: 14px;
      border: 3px solid #111;
      background: #f9a8bc;
      color: #111;
      font-size: 1rem;
      font-weight: 900;
      font-family: 'Nunito', 'Arial Black', sans-serif;
      text-transform: lowercase;
      cursor: pointer;
      box-shadow: 3px 3px 0 #111;
      outline: none;
      display: none;
    }

    /* ---- RESULT CARD ---- */
    .result-card {
      display: none;
      background: #fff;
      border-radius: 28px;
      overflow: hidden;
      width: 320px;
      max-width: 90vw;
      border: 3px solid #111;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
      flex-direction: column;
      animation: popIn 0.45s cubic-bezier(0.34,1.4,0.64,1) both;
    }
    .result-card.show { display: flex; }

    @keyframes popIn {
      from { opacity:0; transform:scale(0.85); }
      to   { opacity:1; transform:scale(1); }
    }

    .result-img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .result-bottom {
      padding: 16px 20px 20px;
      text-align: left;
    }

    .result-emojis { font-size: 1.4rem; margin-bottom: 4px; }

    .result-text {
      font-size: 2rem;
      font-weight: 900;
      color: #111;
      line-height: 1.1;
    }

    /* confetti */
    .cp {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: cf linear forwards;
    }
    @keyframes cf {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- Question -->
<div class="card" id="questionCard">
  <span class="star">🌟</span>
  <h1>2.5?</h1>
  <div class="poll-row">
    <button class="btn btn-yes" onclick="sayYes()">так</button>
    <button class="btn btn-no" id="btnNoStatic"
      onmouseenter="activateFly()" ontouchstart="activateFly()">ні</button>
  </div>
</div>

<!-- Flying "ні" (appears after first hover) -->
<button id="btnNoFly" onmouseenter="runAway()" ontouchstart="runAway()">ні</button>

<!-- Result -->
<div class="result-card" id="resultCard">
  <img class="result-img" id="resultImg" src="" alt="">
  <div class="result-bottom">
    <div class="result-emojis">🥰 😏</div>
    <div class="result-text">так і знала</div>
  </div>
</div>

var noCount = 0;
var flyActive = false;

var btnStatic = document.getElementById('btnNoStatic');
var btnFly    = document.getElementById('btnNoFly');

function activateFly() {
  if (flyActive) return;
  flyActive = true;

  // hide static button, show flying one at same position
  var r = btnStatic.getBoundingClientRect();
  btnFly.style.left   = r.left + 'px';
  btnFly.style.top    = r.top  + 'px';
  btnFly.style.width  = r.width + 'px';
  btnFly.style.height = r.height + 'px';
  btnFly.style.display = 'block';
  btnStatic.style.visibility = 'hidden';

  runAway();
}

function runAway() {
  noCount++;
  var m  = 16;
  var bw = btnFly.offsetWidth;
  var bh = btnFly.offsetHeight;
  var maxX = window.innerWidth  - bw - m;
  var maxY = window.innerHeight - bh - m;
  var x = Math.random() * maxX + m;
  var y = Math.random() * maxY + m;
  btnFly.style.transition = 'left 0.18s cubic-bezier(.34,1.5,.64,1), top 0.18s cubic-bezier(.34,1.5,.64,1)';
  btnFly.style.left = x + 'px';
  btnFly.style.top  = y + 'px';
  if (noCount > 5)  { btnFly.style.transform = 'scale(0.8)'; }
  if (noCount > 10) { btnFly.style.opacity = '0.35'; }
}

function sayYes() {
  document.getElementById('questionCard').style.display = 'none';
  btnFly.style.display = 'none';
  var rc = document.getElementById('resultCard');
  document.getElementById('resultImg').src = PHOTO;
  rc.classList.add('show');
  spawnConfetti();
}

function spawnConfetti() {
  var colors = ['#7ee89a','#f9a8bc','#ffe066','#a0d8ff','#fff','#111'];
  for (var i = 0; i < 80; i++) {
    (function(idx) {
      setTimeout(function() {
        var el = document.createElement('div');
        el.className = 'cp';
        var c = colors[Math.floor(Math.random() * colors.length)];
        var w = 5 + Math.random() * 9;
        var h = 5 + Math.random() * 9;
        var br = Math.random() > 0.5 ? '50%' : '3px';
        var dur = (1.6 + Math.random() * 2).toFixed(2);
        el.style.cssText = 'left:' + (Math.random()*100) + 'vw;top:-12px;'
          + 'background:' + c + ';width:' + w + 'px;height:' + h + 'px;'
          + 'border-radius:' + br + ';animation-duration:' + dur + 's;';
        document.body.appendChild(el);
        setTimeout(function(){ el.remove(); }, 4000);
      }, idx * 25);
    })(i);
  }
}
</script>
